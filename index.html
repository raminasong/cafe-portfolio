<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Portfolio</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="loader">
      <p>Brewing…</p>
      <div class="bar"><span id="loader-fill"></span></div>
    </div>

    <div id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" hidden>
      <div class="welcome-card">
        <h2 id="welcome-title">Hi, I'm Ramina!</h2>
        <p>Welcome to my portfolio. Feel free to click around the café to get to know me!</p>
        <button id="welcome-close">Come on in</button>
      </div>
    </div>

    <nav id="nav"></nav>
    <div id="tooltip" hidden></div>

    <aside id="panel" aria-hidden="true">
      <button id="panel-close" aria-label="Close">×</button>
      <div id="panel-body"></div>
    </aside>

    <p id="hint">Drag to look around · click objects to explore</p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
